<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ subject }}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }

        /* Client-specific */
        #outlook a { padding: 0; }
        .ReadMsgBody { width: 100%; }
        .ExternalClass { width: 100%; }
        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }

        /* Typography */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.55;
            color: #15161a;
            background-color: #f5f5f5;
        }

        /* Preheader hide */
        .preheader {
            display: none !important;
            visibility: hidden;
            mso-hide: all;
            font-size: 1px;
            line-height: 1px;
            max-height: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
        }

        /* Container */
        .email-container {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        /* Content */
        .email-content {
            padding: 40px 32px;
        }

        @media screen and (max-width: 600px) {
            .email-content {
                padding: 32px 20px !important;
            }
        }

        /* Headings */
        h1, h2, h3 {
            margin: 0 0 16px 0;
            color: #15161a;
            font-weight: 600;
        }

        /* Paragraphs */
        p {
            margin: 0 0 16px 0;
            color: #15161a;
        }

        /* Lists */
        ul, ol {
            margin: 0 0 16px 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            color: #15161a;
        }

        /* Links */
        a {
            color: #3b82f6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Primary CTA Button */
        .cta-button {
            display: inline-block;
            background-color: #15161a;
            color: #ffffff !important;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            margin: 8px 0 24px 0;
        }

        .cta-button:hover {
            background-color: #2d2e33;
            text-decoration: none;
        }

        /* Secondary Button */
        .cta-secondary {
            display: inline-block;
            color: #6b7280 !important;
            font-size: 13px;
            text-decoration: none;
            margin-top: 8px;
        }

        .cta-secondary:hover {
            color: #15161a !important;
        }

        /* Signature */
        .signature {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            padding: 24px 32px;
            background-color: #f9fafb;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .footer a {
            color: #6b7280;
        }

        .footer p {
            margin: 0 0 8px 0;
            color: #9ca3af;
            font-size: 12px;
        }

        /* Stats Block */
        .stats-block {
            background-color: #f9fafb;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 16px 0;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .stats-label {
            color: #6b7280;
            font-size: 13px;
        }

        .stats-value {
            color: #15161a;
            font-weight: 600;
            font-size: 14px;
        }

        /* Brand List */
        .brand-list {
            margin: 16px 0;
        }

        .brand-item {
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .brand-item:last-child {
            border-bottom: none;
        }

        .brand-name {
            font-weight: 600;
            color: #15161a;
        }

        .brand-meta {
            font-size: 13px;
            color: #6b7280;
        }

        /* Numbered List */
        .numbered-list {
            counter-reset: item;
            list-style-type: none;
            padding-left: 0;
        }

        .numbered-list li {
            counter-increment: item;
            margin-bottom: 12px;
            padding-left: 28px;
            position: relative;
        }

        .numbered-list li::before {
            content: counter(item) ".";
            position: absolute;
            left: 0;
            font-weight: 600;
            color: #3b82f6;
        }

        /* Highlight Box */
        .highlight-box {
            background-color: #eff6ff;
            border-left: 3px solid #3b82f6;
            padding: 16px 20px;
            margin: 16px 0;
            border-radius: 0 8px 8px 0;
        }

        .highlight-box p {
            margin: 0;
            color: #1e40af;
        }

        /* Win Box */
        .win-box {
            background-color: #f0fdf4;
            border-left: 3px solid #10b981;
            padding: 16px 20px;
            margin: 16px 0;
            border-radius: 0 8px 8px 0;
        }

        .win-box p {
            margin: 0;
            color: #065f46;
        }
    </style>
</head>
<body>
    <!-- Preheader text (hidden but shown in email preview) -->
    <span class="preheader">{{ preheader }}{% for i in range(100) %}&nbsp;{% endfor %}</span>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
        <tr>
            <td align="center" style="padding: 24px 16px;">
                <table role="presentation" class="email-container" width="560" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden;">
                    <!-- Content -->
                    <tr>
                        <td class="email-content">
                            {% block content %}{% endblock %}

                            <!-- Signature -->
                            <p class="signature">Your Newcollab Manager</p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>You're receiving this because you signed up for Newcollab.</p>
                            <p>
                                <a href="{{ preferences_url }}">Update preferences</a>
                                &nbsp;&bull;&nbsp;
                                <a href="{{ unsubscribe_url }}">Unsubscribe</a>
                            </p>
                            <p style="margin-top: 12px;">Newcollab</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
