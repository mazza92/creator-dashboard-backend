<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your Newcollab account</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.55;
            color: #15161a;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 560px;
            margin: 24px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        .content {
            padding: 40px 32px;
        }
        p {
            margin: 0 0 16px 0;
        }
        .cta-button {
            display: inline-block;
            background-color: #15161a;
            color: #ffffff !important;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            margin: 8px 0 24px 0;
        }
        .note {
            color: #6b7280;
            font-size: 13px;
            margin-top: 24px;
        }
        .signature {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
        <tr>
            <td align="center" style="padding: 24px 16px;">
                <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td class="content">
                            <p>Hi {{ first_name or "there" }},</p>

                            <p>Welcome to Newcollab. Click below to verify your email and get started.</p>

                            <a href="{{ verify_url }}" class="cta-button">Verify email</a>

                            <p class="note">Your verification link expires in 24 hours.</p>

                            <p class="note">If you didn't sign up, ignore this email.</p>

                            <p class="signature">Your Newcollab Manager</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
